name: Validate processor
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate Python syntax
        run: python -m py_compile app.py
      - name: Validate FFmpeg availability
        run: |
          ffmpeg -version
